<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valorant Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --green: #2bff3b;
    --ink: #111;
    --paper: #fff;
    --dab: rgba(255, 230, 0, 0.78);
    --bingo: #ff4655;
    /* swapped per language; the BINGO row always stays Anton since it's Latin */
    --ui-font: 'Archivo Narrow', 'Arial Narrow', sans-serif;
    --display-font: 'Anton', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f1923;
    background-image: radial-gradient(circle at 20% 0%, #1f2d3a 0%, #0f1923 60%);
    font-family: var(--ui-font);
    display: flex;
    justify-content: center;
    padding: 24px 12px 40px;
    color: var(--ink);
  }
  .card {
    background: var(--paper);
    width: 100%;
    max-width: 560px;
    padding: 14px 18px 22px;
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: #555;
  }
  .topbar select {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 3px 6px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .letters {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: clamp(44px, 14vw, 78px);
    line-height: 1.05;
    margin: 2px 0 6px;
  }
  .letters span { transition: color .3s, transform .3s; }
  .letters span.lit { color: var(--bingo); transform: scale(1.08); }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border: 3px solid var(--ink);
  }
  .cell {
    position: relative;
    aspect-ratio: 1;
    border: 1.5px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px;
    font-weight: 700;
    font-size: clamp(11px, 3.4vw, 18px);
    line-height: 1.1;
    cursor: pointer;
    user-select: none;
    background: var(--paper);
    transition: background .15s;
    overflow: hidden;
  }
  .cell:hover { background: #f4f4f4; }
  .cell:focus-visible { outline: 3px solid #3b82f6; outline-offset: -3px; }
  .cell .label { position: relative; z-index: 2; overflow-wrap: anywhere; }
  /* long labels (German compounds, Japanese katakana strings) need to shrink to fit */
  .cell.long .label { font-size: .84em; line-height: 1.15; }
  .cell.longest .label { font-size: .7em; line-height: 1.2; }
  .cell::after {
    content: "";
    position: absolute;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: var(--dab);
    z-index: 1;
    transform: scale(0) rotate(var(--rot, 0deg));
    transition: transform .18s cubic-bezier(.3,1.6,.6,1);
    left: calc(11% + var(--dx, 0px));
    top: calc(11% + var(--dy, 0px));
    pointer-events: none;
  }
  .cell.marked::after { transform: scale(1) rotate(var(--rot, 0deg)); }
  .cell.win { background: #ffe4e6; }
  .status {
    text-align: center;
    min-height: 1.6em;
    margin: 12px 0 4px;
    font-family: var(--display-font);
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--bingo);
  }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    padding: 9px 16px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button.primary { background: var(--bingo); border-color: var(--bingo); color: #fff; }
  button.primary:hover { background: #d93a47; }
  .colors {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin: 4px 0 10px;
    font-weight: 700;
    font-size: 15px;
  }
  .swatch {
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: var(--c);
    cursor: pointer;
  }
  .swatch:hover { background: var(--c); transform: scale(1.1); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
  .modes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 0 0 10px;
  }
  .modes button {
    padding: 8px 4px;
    font-size: clamp(11px, 3vw, 15px);
    line-height: 1.15;
    overflow-wrap: anywhere;
  }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .hint { text-align: center; font-size: 13px; color: #666; margin-top: 10px; }
  .warn {
    margin: 10px 0 0;
    padding: 8px 10px;
    border: 2px solid #b45309;
    border-radius: 4px;
    background: #fef3c7;
    color: #78350f;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    line-height: 1.35;
  }
  .warn[hidden] { display: none; }
  .editing .cell { cursor: text; }
  .editing .cell .label { outline: 1px dashed #999; padding: 2px; min-width: 60%; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .status.pop { animation: pop .5s; }
  .tip {
    position: fixed;
    z-index: 50;
    max-width: 220px;
    padding: 7px 10px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    border-radius: 5px;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%) translateY(-6px);
    transition: opacity .12s;
  }
  .tip.show { opacity: 1; }
  .tip::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    margin-left: -6px;
    border: 6px solid transparent;
    border-bottom: 0;
    border-top-color: var(--ink);
  }
</style>
</head>
<body>
<main class="card">
  <div class="topbar">
    <label for="lang" id="langLabel">Language</label>
    <select id="lang"></select>
  </div>
  <div class="letters" id="letters"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
  <div class="modes" id="modes" role="group" aria-label="Game mode"></div>
  <div class="grid" id="grid" role="grid" aria-label="Bingo board"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="colors" id="colors"><span id="stampLabel">Stamp:</span></div>
  <div class="controls">
    <button class="primary" id="shuffle">New board</button>
    <button id="reset">Clear stamps</button>
    <button id="edit">Edit squares</button>
    <button id="clearEdits" hidden>Reset edits</button>
  </div>
  <p class="hint" id="hint">Tap a square to stamp it. Hover for details.</p>
  <p class="warn" id="warn" role="alert" hidden></p>
</main>
<div class="tip" id="tip" role="tooltip"></div>

// =========================================

const MODE_ORDER = ["competitive", "unrated", "swiftplay", "spikerush"];
const MODE_NAMES_EN = {
  competitive: "Competitive",
  unrated:     "Unrated",
  swiftplay:   "Swiftplay",
  spikerush:   "Spike Rush"
};

const KEY = "valorant-bingo";
const VERSION = 6;
const LEGACY_KEYS = ["valorant-bingo-v4"];
const LITERAL = "lit:";   // board entry carrying its own text instead of a SQUARES id

const BY_ID = new Map(SQUARES.map(s => [s.id, s]));
const BY_TEXT = new Map(SQUARES.map(s => [s.text, s.id]));

// ----- storage: report failures instead of swallowing them -----
const store = {
  available: false,
  read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  },
  write(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }
};
try {
  const probe = KEY + "-probe";
  localStorage.setItem(probe, "1");
  localStorage.removeItem(probe);
  store.available = true;
} catch (e) {
  store.available = false;
}

function poolFor(mode) {
  return SQUARES.filter(s => !s.modes || s.modes.includes(mode));
}

function newBoard(mode) {
  const pool = poolFor(mode);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 25).map(s => s.id);
}

function freshMarks() {
  return Array(25).fill(false);
}

function detectLang() {
  const tags = (navigator.languages && navigator.languages.length)
    ? navigator.languages
    : [navigator.language || "en"];
  for (const tag of tags) {
    const base = String(tag).toLowerCase().split("-")[0];
    if (LOCALES[base]) return base;
  }
  return "en";
}

function freshState(mode, lang) {
  return {
    version: VERSION,
    lang,
    mode,
    board: newBoard(mode),
    marked: freshMarks(),
    color: "yellow",
    overrides: {}
  };
}

// A board entry is either a SQUARES id, or "lit:<text>" for a square whose text came
// from an old save and no longer matches anything in the list.
function squareFor(id) {
  if (typeof id !== "string" || !id) return null;
  if (id.startsWith(LITERAL)) {
    const text = id.slice(LITERAL.length);
    return text ? { id, text, hint: "" } : null;
  }
  return BY_ID.get(id) || null;
}

// Repair whatever is salvageable. Returns null only when the board itself is unusable,
// so a corrupt marks array or junk override map costs you stamps, not the whole board.
function coerceState(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  if (!Array.isArray(raw.board) || raw.board.length !== 25) return null;

  const mode = MODE_NAMES_EN[raw.mode] ? raw.mode : "competitive";

  // v5 and earlier stored {text, hint} per cell; v6 stores ids
  const board = [];
  for (const entry of raw.board) {
    if (typeof entry === "string") {
      board.push(entry);
    } else if (entry && typeof entry === "object" && typeof entry.text === "string" && entry.text) {
      board.push(BY_TEXT.get(entry.text) || LITERAL + entry.text);
    } else {
      return null;
    }
  }

  // An id that no longer exists (renamed or removed square) is swapped for an unused
  // one from the same mode rather than nuking the whole board.
  const used = new Set(board);
  const spares = poolFor(mode).filter(s => !used.has(s.id));
  for (let i = 0; i < board.length; i++) {
    if (squareFor(board[i])) continue;
    const spare = spares.pop();
    if (!spare) return null;
    board[i] = spare.id;
  }

  const marked = Array.isArray(raw.marked) && raw.marked.length === 25
    ? raw.marked.map(Boolean)
    : freshMarks();

  // v5 keyed overrides by English square text at the top level; v6 nests them per language
  const overrides = {};
  const addOverride = (lang, key, value) => {
    if (typeof value !== "string" || !value.trim()) return;
    const id = BY_ID.has(key) ? key : BY_TEXT.get(key);
    if (!id) return;
    (overrides[lang] || (overrides[lang] = {}))[id] = value.trim().slice(0, 120);
  };
  if (raw.overrides && typeof raw.overrides === "object" && !Array.isArray(raw.overrides)) {
    for (const [key, value] of Object.entries(raw.overrides)) {
      if (typeof value === "string") addOverride("en", key, value);
      else if (value && typeof value === "object" && !Array.isArray(value) && LOCALES[key]) {
        for (const [id, text] of Object.entries(value)) addOverride(key, id, text);
      }
    }
  }

  return {
    version: VERSION,
    lang: LOCALES[raw.lang] ? raw.lang : detectLang(),
    mode,
    board,
    marked,
    color: raw.color,
    overrides
  };
}

function loadState() {
  for (const key of [KEY].concat(LEGACY_KEYS)) {
    const text = store.read(key);
    if (!text) continue;
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) { continue; }
    const migrated = coerceState(parsed);
    if (migrated) return { state: migrated, from: key, upgraded: parsed.version !== VERSION };
  }
  return { state: null, from: null, upgraded: false };
}

const loaded = loadState();
let state = loaded.state || freshState("competitive", detectLang());
// Write on first visit too, otherwise reloading before your first stamp hands you a
// different board. Also covers a migrated save and an older version being upgraded.
const needsWrite = loaded.state === null || loaded.from !== KEY || loaded.upgraded;

let warnedOnce = false;
const save = () => {
  state.version = VERSION;
  if (store.write(KEY, JSON.stringify(state))) return;
  if (warnedOnce) return;
  warnedOnce = true;
  showWarn(t("saveFailed"));
};

const LINES = [];
for (let i = 0; i < 5; i++) {
  LINES.push([0,1,2,3,4].map(j => i*5+j));
  LINES.push([0,1,2,3,4].map(j => j*5+i));
}
LINES.push([0,6,12,18,24], [4,8,12,16,20]);

// ----- strings -----
const fmt = (template, vars) => template.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));

// Looks up a dotted key in the active language, then English, so a partial
// translation degrades one string at a time instead of breaking the page.
function t(key, vars) {
  for (const lang of [state.lang, "en"]) {
    let node = LOCALES[lang] && LOCALES[lang].ui;
    for (const part of key.split(".")) node = node && node[part];
    if (typeof node === "string") return vars ? fmt(node, vars) : node;
  }
  return key;
}

function modeName(mode) {
  const localized = LOCALES[state.lang] && LOCALES[state.lang].modes;
  return (localized && localized[mode]) || MODE_NAMES_EN[mode];
}

// Edits are keyed by language and by the square's original id, so they follow that
// square onto every future board and don't bleed across languages.
function squareText(sq) {
  const edited = (state.overrides[state.lang] || {})[sq.id];
  return edited || baseText(sq);
}

function baseText(sq) {
  const tr = translated(sq.id);
  return (tr && tr.text) || sq.text;
}

function squareHint(sq) {
  const tr = translated(sq.id);
  return (tr && tr.hint) || sq.hint || "";
}

function translated(id) {
  const squares = LOCALES[state.lang] && LOCALES[state.lang].squares;
  return squares && squares[id];
}

function setOverride(sq, text) {
  const clean = text.replace(/\s+/g, " ").trim().slice(0, 120);
  const bucket = state.overrides[state.lang] || (state.overrides[state.lang] = {});
  if (!clean || clean === baseText(sq)) delete bucket[sq.id];
  else bucket[sq.id] = clean;
  save();
}

// ----- stamp colors -----
const COLORS = {
  green:  "rgba(43, 220, 60, 0.72)",
  red:    "rgba(255, 60, 70, 0.72)",
  yellow: "rgba(255, 230, 0, 0.78)",
  pink:   "rgba(255, 105, 190, 0.72)",
  purple: "rgba(150, 70, 230, 0.68)"
};
if (!COLORS[state.color]) state.color = "yellow";

const colorsEl = document.getElementById("colors");
function buildColors() {
  colorsEl.querySelectorAll(".swatch").forEach(b => b.remove());
  Object.keys(COLORS).forEach(name => {
    const b = document.createElement("button");
    b.className = "swatch";
    b.dataset.color = name;
    b.title = t("colors." + name);
    b.setAttribute("aria-label", t("stampAria", { color: t("colors." + name) }));
    b.setAttribute("aria-pressed", name === state.color);
    b.style.setProperty("--c", COLORS[name]);
    b.onclick = () => { state.color = name; save(); applyColor(); };
    colorsEl.appendChild(b);
  });
}
function applyColor() {
  document.documentElement.style.setProperty("--dab", COLORS[state.color]);
  colorsEl.querySelectorAll(".swatch").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.color === state.color));
}

// ----- game modes -----
const modesEl = document.getElementById("modes");
function buildModes() {
  modesEl.innerHTML = "";
  MODE_ORDER.forEach(key => {
    const b = document.createElement("button");
    b.dataset.mode = key;
    b.textContent = modeName(key);
    b.setAttribute("aria-pressed", key === state.mode);
    b.onclick = () => {
      if (state.mode === key) return;
      state.mode = key;
      state.board = newBoard(key);
      state.marked = freshMarks();
      lastCount = 0;
      save(); applyMode(); render();
    };
    modesEl.appendChild(b);
  });
}
function applyMode() {
  modesEl.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
}

// ----- language -----
const langEl = document.getElementById("lang");
Object.entries(LOCALES).forEach(([code, locale]) => {
  const o = document.createElement("option");
  o.value = code;
  o.textContent = locale.label;
  langEl.appendChild(o);
});
langEl.value = state.lang;
langEl.onchange = () => {
  if (!LOCALES[langEl.value]) return;
  state.lang = langEl.value;   // the board is a list of ids, so switching only re-labels it
  save();
  applyLang();
};

// Japanese (and any other non-Latin script) needs its own font; load it on demand so
// English users don't download a CJK face they'll never see.
function applyFont() {
  const root = document.documentElement.style;
  const font = LOCALES[state.lang] && LOCALES[state.lang].font;
  if (!font) {
    root.removeProperty("--ui-font");
    root.removeProperty("--display-font");
    return;
  }
  const id = "font-" + state.lang;
  if (!document.getElementById(id)) {
    const link = document.createElement("link");
    link.id = id;
    link.rel = "stylesheet";
    link.href = font.href;
    document.head.appendChild(link);
  }
  root.setProperty("--ui-font", font.ui);
  root.setProperty("--display-font", font.display);
}

function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t("docTitle");
  applyFont();
  document.getElementById("langLabel").textContent = t("langLabel");
  langEl.value = state.lang;
  modesEl.setAttribute("aria-label", t("modeGroup"));
  grid.setAttribute("aria-label", t("gridLabel"));
  document.getElementById("stampLabel").textContent = t("stampLabel");
  document.getElementById("shuffle").textContent = t("newBoard");
  document.getElementById("reset").textContent = t("clearStamps");
  editBtn.textContent = editing ? t("doneEditing") : t("editSquares");
  clearEditsBtn.textContent = t("resetEdits");
  hintEl.textContent = editing ? t("hintEditing") : t("hintDefault");
  if (!warnEl.hidden) warnEl.textContent = t("saveFailed");
  buildModes();
  buildColors();
  applyColor();
  render();
}

// ----- hover tooltip -----
const tip = document.getElementById("tip");
function showTip(cell, text) {
  if (!text) return hideTip();
  tip.textContent = text;
  const r = cell.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(r.left + r.width / 2, 120), window.innerWidth - 120) + "px";
  tip.style.top = r.top + "px";
  tip.classList.add("show");
}
function hideTip() { tip.classList.remove("show"); }
window.addEventListener("scroll", hideTip, { passive: true });

// ----- board -----
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");
const warnEl = document.getElementById("warn");
const editBtn = document.getElementById("edit");
const clearEditsBtn = document.getElementById("clearEdits");
function showWarn(msg) { warnEl.textContent = msg; warnEl.hidden = false; }

function wonLines() { return LINES.filter(line => line.every(i => state.marked[i])); }

let editing = false;
// seeded from saved marks so reloading a winning board doesn't replay the pop
let lastCount = wonLines().length;

function render() {
  grid.innerHTML = "";
  state.board.forEach((id, i) => {
    const sq = squareFor(id) || { id: id, text: id, hint: "" };
    const label = squareText(sq);
    const hint = squareHint(sq);

    const c = document.createElement("div");
    c.className = "cell" + (state.marked[i] ? " marked" : "");
    // translations run longer or shorter than English; shrink the text rather than clip it
    const len = Array.from(label).length;
    if (len > 20) c.classList.add("longest");
    else if (len > 13) c.classList.add("long");
    c.tabIndex = 0;
    c.setAttribute("role", "gridcell");
    c.setAttribute("aria-pressed", state.marked[i]);
    if (hint) c.setAttribute("aria-description", hint);
    const r = (i * 37) % 11;
    c.style.setProperty("--rot", (r * 13) + "deg");
    c.style.setProperty("--dx", ((r % 5) - 2) * 2 + "px");
    c.style.setProperty("--dy", ((r % 3) - 1) * 3 + "px");

    const l = document.createElement("span");
    l.className = "label";
    l.textContent = label;
    if (editing) {
      l.contentEditable = "true";
      // store text, never markup: pasted HTML can't survive into a saved board
      l.addEventListener("paste", e => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text");
        document.execCommand("insertText", false, text.replace(/\s+/g, " "));
      });
      l.addEventListener("input", () => setOverride(sq, l.textContent));
    }
    c.appendChild(l);

    c.addEventListener("mouseenter", () => showTip(c, hint));
    c.addEventListener("mouseleave", hideTip);
    c.addEventListener("focus", () => showTip(c, hint));
    c.addEventListener("blur", hideTip);
    c.addEventListener("pointerup", e => {
      // touch screens have no hover, so show the hint under the board instead
      if (e.pointerType === "touch" && hint) hintEl.textContent = hint;
    });
    c.addEventListener("click", () => toggle(i));
    c.addEventListener("keydown", e => {
      if (!editing && (e.key === " " || e.key === "Enter")) { e.preventDefault(); toggle(i); }
    });
    grid.appendChild(c);
  });
  check();
}

function toggle(i) {
  if (editing) return;
  hideTip();
  state.marked[i] = !state.marked[i];
  save();
  render();
}

function check() {
  const won = wonLines();
  const cells = grid.children;
  won.flat().forEach(i => cells[i].classList.add("win"));
  const n = won.length;
  document.querySelectorAll("#letters span").forEach((s, k) => s.classList.toggle("lit", k < n));
  if (state.marked.every(Boolean)) statusEl.textContent = t("blackout");
  else if (n === 0) statusEl.textContent = "";
  else if (n === 1) statusEl.textContent = t("bingo");
  else statusEl.textContent = t("bingoMulti", { n: n });
  if (n > lastCount) { statusEl.classList.remove("pop"); void statusEl.offsetWidth; statusEl.classList.add("pop"); }
  lastCount = n;
}

document.getElementById("reset").onclick = () => {
  state.marked = freshMarks();
  lastCount = 0;
  save(); render();
};

document.getElementById("shuffle").onclick = () => {
  state.board = newBoard(state.mode);
  state.marked = freshMarks();
  lastCount = 0;
  hintEl.textContent = t("hintDefault");
  save(); render();
};

editBtn.onclick = () => {
  editing = !editing;
  hideTip();
  document.body.classList.toggle("editing", editing);
  editBtn.textContent = editing ? t("doneEditing") : t("editSquares");
  clearEditsBtn.hidden = !editing;
  hintEl.textContent = editing ? t("hintEditing") : t("hintDefault");
  render();
};

// clears edits for the language you're looking at, not every language at once
clearEditsBtn.onclick = () => {
  delete state.overrides[state.lang];
  save();
  render();
};
