<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valorant Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2bff3b;
    --ink: #111;
    --paper: #fff;
    --dab: rgba(255, 230, 0, 0.78);
    --bingo: #ff4655;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f1923;
    background-image: radial-gradient(circle at 20% 0%, #1f2d3a 0%, #0f1923 60%);
    font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px 40px;
    color: var(--ink);
  }
  .card {
    background: var(--paper);
    width: 100%;
    max-width: 560px;
    padding: 18px 18px 22px;
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  h1 {
    margin: 0;
    text-align: center;
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(26px, 7vw, 40px);
    color: var(--green);
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
    letter-spacing: .5px;
    line-height: 1.1;
  }
  .letters {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: clamp(44px, 14vw, 78px);
    line-height: 1.05;
    margin: 4px 0 6px;
  }
  .letters span { transition: color .3s, transform .3s; }
  .letters span.lit { color: var(--bingo); transform: scale(1.08); }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border: 3px solid var(--ink);
  }
  .cell {
    position: relative;
    aspect-ratio: 1;
    border: 1.5px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px;
    font-weight: 700;
    font-size: clamp(11px, 3.4vw, 18px);
    line-height: 1.1;
    cursor: pointer;
    user-select: none;
    background: var(--paper);
    transition: background .15s;
    overflow: hidden;
  }
  .cell:hover { background: #f4f4f4; }
  .cell:focus-visible { outline: 3px solid #3b82f6; outline-offset: -3px; }
  .cell small { display: block; font-size: .72em; font-weight: 600; }
  .cell .label { position: relative; z-index: 2; }
  .cell::after {
    content: "";
    position: absolute;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: var(--dab);
    z-index: 1;
    transform: scale(0) rotate(var(--rot, 0deg));
    transition: transform .18s cubic-bezier(.3,1.6,.6,1);
    left: calc(11% + var(--dx, 0px));
    top: calc(11% + var(--dy, 0px));
    pointer-events: none;
  }
  .cell.marked::after { transform: scale(1) rotate(var(--rot, 0deg)); }
  .cell.win { background: #ffe4e6; }
  .status {
    text-align: center;
    min-height: 1.6em;
    margin: 12px 0 4px;
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--bingo);
  }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    padding: 9px 16px;
    border: 2px solid var(--ink);
    background: var(--paper);
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button.primary { background: var(--bingo); border-color: var(--bingo); color: #fff; }
  button.primary:hover { background: #d93a47; }
  .colors {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin: 4px 0 10px;
    font-weight: 700;
    font-size: 15px;
  }
  .swatch {
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: var(--c);
    cursor: pointer;
  }
  .swatch:hover { background: var(--c); transform: scale(1.1); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
  .hint { text-align: center; font-size: 13px; color: #666; margin-top: 10px; }
  .editing .cell { cursor: text; }
  .editing .cell .label { outline: 1px dashed #999; padding: 2px; min-width: 60%; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .status.pop { animation: pop .5s; }
  .tip {
    position: fixed;
    z-index: 50;
    max-width: 220px;
    padding: 7px 10px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    border-radius: 5px;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%) translateY(-6px);
    transition: opacity .12s;
  }
  .tip.show { opacity: 1; }
  .tip::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    margin-left: -6px;
    border: 6px solid transparent;
    border-bottom: 0;
    border-top-color: var(--ink);
  }
</style>
</head>
<body>
<main class="card">
  <div class="letters" id="letters"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
  <div class="grid" id="grid" role="grid" aria-label="Bingo board"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="colors" id="colors"><span>Stamp:</span></div>
  <div class="controls">
    <button class="primary" id="shuffle">New board</button>
    <button id="reset">Clear stamps</button>
    <button id="edit">Edit squares</button>
  </div>
  <p class="hint" id="hint">Tap a square to stamp it. Hover for details.</p>
</main>
<div class="tip" id="tip" role="tooltip"></div>

<script>
// ===== Bingo squares: edit this list =====
// text: what shows on the square   hint: helper text shown on hover
const SQUARES = [
  { text: "1v2 Clutch",        hint: "Win a round as the last one alive against 2 enemies." },
  { text: "1v3+ Clutch",       hint: "Win a round as the last one alive against 3 or more enemies." },
  { text: "Personal Ace",      hint: "One player kills all 5 enemies in a single round." },
  { text: "Team Ace",          hint: "All 5 teammates each get a kill in the same round." },
  { text: "Personal 4K",       hint: "One player gets 4 kills in a single round." },
  { text: "Op One-Tap",        hint: "One-shot kill with the Operator." },
  { text: "Collateral",        hint: "Kill 2 or more enemies with a single bullet." },
  { text: "Wallbang Kill",     hint: "Get a kill by shooting through a wall or object." },
  { text: "Kill While Flashed",hint: "Get a kill while blinded by a flash." },
  { text: "Spray Transfer",    hint: "3 or more kills in one continuous spray." },
  { text: "Eco Win",           hint: "Win a round on a save/eco buy." },
  { text: "Pistol Round Win",  hint: "Win round 1 or round 13." },
  { text: "Sheriff Headshot",  hint: "Headshot kill with the Sheriff." },
  { text: "Classic Kill",      hint: "Get a kill with the Classic." },
  { text: "Marshal Kill",      hint: "Get a kill with the Marshal." },
  { text: "Ares/Odin Kill",    hint: "Get a kill with the Ares or Odin." },
  { text: "Shorty Kill",       hint: "Get a kill with the Shorty." },
  { text: "Knife Kill",        hint: "Get a melee kill." },
  { text: "Defuse &lt;1s",     hint: "Defuse the spike with under 1 second left." },
  { text: "Ninja Defuse",      hint: "Defuse the spike while enemies are still alive." },
  { text: "Plant &lt;5s",      hint: "Plant the spike with under 5 seconds left on the round timer." },
  { text: "Win on Time",       hint: "Defenders win because attackers never planted." },
  { text: "Ult Kills 2+",      hint: "One ultimate kills 2 or more enemies." },
  { text: "Wasted Ult",        hint: "An ultimate used with no kills and no impact." },
  { text: "Recon Dart 3+",     hint: "One Sova recon bolt reveals 3 or more enemies." },
  { text: "Instalock Reyna",   hint: "Someone locks Reyna instantly in agent select." },
  { text: "No Initiator",      hint: "The team has no initiator." },
  { text: "3+ Duelists",       hint: "The team runs 3 or more duelists." },
  { text: "Someone No Mic",    hint: "A teammate never uses voice comms." },
  { text: "Teammate AFK",      hint: "A teammate is AFK for a full round." },
  { text: "Toxic All Chat",    hint: "An enemy is very toxic in all chat." },
  { text: "FF Vote",           hint: "Someone calls a surrender vote." },
  { text: "Overtime",          hint: "The match goes to overtime (12–12)." },
  { text: "13–0 / 0–13",       hint: "The match ends 13–0 either way." },
  { text: "5+ Round Comeback", hint: "Win the match after being down 5 or more rounds." },
  { text: "Clutch Rotate",     hint: "A last-second rotate saves the round." },
  { text: "Match MVP",         hint: "Top of the scoreboard when the match ends." }
];

// =========================================

const KEY = "valorant-bingo-v3";

function newBoard() {
  const pool = SQUARES.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 25).map(s => ({ ...s }));
}

function freshMarks() {
  return Array(25).fill(false);
}

let state = null;
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.board) && saved.board.length === 25) state = saved;
} catch (e) {}
if (!state) state = { board: newBoard(), marked: freshMarks(), color: "yellow" };

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const LINES = [];
for (let i = 0; i < 5; i++) {
  LINES.push([0,1,2,3,4].map(j => i*5+j));
  LINES.push([0,1,2,3,4].map(j => j*5+i));
}
LINES.push([0,6,12,18,24], [4,8,12,16,20]);

// ----- stamp colors -----
const COLORS = {
  green:  "rgba(43, 220, 60, 0.72)",
  red:    "rgba(255, 60, 70, 0.72)",
  yellow: "rgba(255, 230, 0, 0.78)",
  pink:   "rgba(255, 105, 190, 0.72)",
  purple: "rgba(150, 70, 230, 0.68)"
};
if (!COLORS[state.color]) state.color = "yellow";

const colorsEl = document.getElementById("colors");
function applyColor() {
  document.documentElement.style.setProperty("--dab", COLORS[state.color]);
  colorsEl.querySelectorAll(".swatch").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.color === state.color));
}
Object.keys(COLORS).forEach(name => {
  const b = document.createElement("button");
  b.className = "swatch";
  b.dataset.color = name;
  b.title = name;
  b.setAttribute("aria-label", name + " stamp");
  b.style.setProperty("--c", COLORS[name]);
  b.onclick = () => { state.color = name; save(); applyColor(); };
  colorsEl.appendChild(b);
});
applyColor();

// ----- hover tooltip -----
const tip = document.getElementById("tip");
function showTip(cell, text) {
  if (!text) return hideTip();
  tip.textContent = text;
  const r = cell.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(r.left + r.width / 2, 120), window.innerWidth - 120) + "px";
  tip.style.top = r.top + "px";
  tip.classList.add("show");
}
function hideTip() { tip.classList.remove("show"); }
window.addEventListener("scroll", hideTip, { passive: true });

// ----- board -----
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");
const DEFAULT_HINT = "Tap a square to stamp it. Hover for details.";
let editing = false;
let lastCount = 0;

function render() {
  grid.innerHTML = "";
  state.board.forEach((sq, i) => {
    const c = document.createElement("div");
    c.className = "cell" + (state.marked[i] ? " marked" : "");
    c.tabIndex = 0;
    c.setAttribute("role", "gridcell");
    c.setAttribute("aria-pressed", state.marked[i]);
    if (sq.hint) c.setAttribute("aria-description", sq.hint);
    const r = (i * 37) % 11;
    c.style.setProperty("--rot", (r * 13) + "deg");
    c.style.setProperty("--dx", ((r % 5) - 2) * 2 + "px");
    c.style.setProperty("--dy", ((r % 3) - 1) * 3 + "px");
    const l = document.createElement("span");
    l.className = "label";
    l.innerHTML = sq.text;
    if (editing) {
      l.contentEditable = "true";
      l.addEventListener("input", () => { state.board[i].text = l.innerHTML; save(); });
    }
    c.appendChild(l);

    c.addEventListener("mouseenter", () => showTip(c, sq.hint));
    c.addEventListener("mouseleave", hideTip);
    c.addEventListener("focus", () => showTip(c, sq.hint));
    c.addEventListener("blur", hideTip);
    c.addEventListener("pointerup", e => {
      // touch screens have no hover, so show the hint under the board instead
      if (e.pointerType === "touch" && sq.hint) hintEl.textContent = sq.hint;
    });
    c.addEventListener("click", () => toggle(i));
    c.addEventListener("keydown", e => {
      if (!editing && (e.key === " " || e.key === "Enter")) { e.preventDefault(); toggle(i); }
    });
    grid.appendChild(c);
  });
  check();
}

function toggle(i) {
  if (editing) return;
  hideTip();
  state.marked[i] = !state.marked[i];
  save();
  render();
}

function check() {
  const won = LINES.filter(line => line.every(i => state.marked[i]));
  const cells = grid.children;
  won.flat().forEach(i => cells[i].classList.add("win"));
  const n = won.length;
  document.querySelectorAll("#letters span").forEach((s, k) => s.classList.toggle("lit", k < n));
  if (state.marked.every(Boolean)) statusEl.textContent = "BLACKOUT! 🐸";
  else if (n === 0) statusEl.textContent = "";
  else if (n === 1) statusEl.textContent = "BINGO!";
  else statusEl.textContent = n + "× BINGO!";
  if (n > lastCount) { statusEl.classList.remove("pop"); void statusEl.offsetWidth; statusEl.classList.add("pop"); }
  lastCount = n;
}

document.getElementById("reset").onclick = () => {
  state.marked = freshMarks();
  lastCount = 0;
  save(); render();
};

document.getElementById("shuffle").onclick = () => {
  state.board = newBoard();
  state.marked = freshMarks();
  lastCount = 0;
  hintEl.textContent = DEFAULT_HINT;
  save(); render();
};

const editBtn = document.getElementById("edit");
editBtn.onclick = () => {
  editing = !editing;
  hideTip();
  document.body.classList.toggle("editing", editing);
  editBtn.textContent = editing ? "Done editing" : "Edit squares";
  hintEl.textContent = editing ? "Click into any square to change its text." : DEFAULT_HINT;
  render();
};

render();
</script>
</body>
</html>
